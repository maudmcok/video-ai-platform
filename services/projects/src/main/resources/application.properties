# Application
quarkus.application.name=projects-service
quarkus.application.version=1.0.0
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Database (Reactive PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/videoai
quarkus.datasource.reactive.url=postgresql://localhost:5432/videoai
quarkus.datasource.username=videoai
quarkus.datasource.password=${DB_PASSWORD:dev_password}
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.reactive.max-size=20

# Hibernate
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway (migrations)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.0.0
quarkus.flyway.locations=db/migration

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing events
mp.messaging.outgoing.domain-events.connector=smallrye-kafka
mp.messaging.outgoing.domain-events.topic=domain-events
mp.messaging.outgoing.domain-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.domain-events.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

# Security (Keycloak OIDC)
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/videoai
quarkus.oidc.client-id=projects-service
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:secret}
quarkus.oidc.tls.verification=none
quarkus.oidc.token.issuer=${quarkus.oidc.auth-server-url}

# Auth Permissions
quarkus.http.auth.permission.public.paths=/q/*,/openapi,/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.theme=original

# Health
quarkus.smallrye-health.ui.always-include=true
quarkus.smallrye-health.ui.root-path=/q/health-ui

# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# OpenTelemetry
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.sampler=traceidratio
quarkus.otel.traces.sampler.arg=1.0
quarkus.otel.resource.attributes=service.name=projects-service,service.version=${quarkus.application.version},environment=${ENVIRONMENT:dev}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.videoai".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=false
quarkus.log.console.json.additional-field."service.name".value=projects-service
quarkus.log.console.json.additional-field."service.version".value=${quarkus.application.version}
quarkus.log.console.json.additional-field."environment".value=${ENVIRONMENT:dev}
quarkus.log.console.json.excluded-keys=password,token,secret,authorization

# Redis
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.timeout=10s

# S3
quarkus.s3.endpoint-override=${S3_ENDPOINT:http://localhost:9000}
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:minioadmin}

# HTTP Client
quarkus.http.limits.max-body-size=500M
quarkus.vertx.max-worker-execute-time=10M

# Dev Services (Testcontainers)
%dev.quarkus.devservices.enabled=false
%test.quarkus.devservices.enabled=true

# Test Profile
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/videoai_test
%test.quarkus.datasource.reactive.url=postgresql://localhost:5433/videoai_test
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.oidc.enabled=false
%test.quarkus.http.auth.permission.authenticated.policy=permit

# Production Profile
%prod.quarkus.log.console.json=true
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.smallrye-health.ui.always-include=false
%prod.quarkus.otel.traces.sampler.arg=0.1
